############################# banner ################################
banner:
  enable : true
  title : "The developer conference where social meets technology"
  bg_image: "images/cropped-portland.jpg"
  date_time : "October 1-2, 2026 | Portland, Maine"
  button:
    enable : false
    label : "Discover more"
    link : "service"

########################## timer #################################
timer:
  enable : true
  title : "Countdown to Monktoberfest 2026"
  # set timer
  year: "2026"
  month: "10"
  day: "01"
  hour: "10"

############################## Event ##############################
event:
  enable : true
  title_outline : "2026"
  title : "The Monktoberfest"
  # image_back : "images/2025-session.jpg"
  # image_front : "images/2025-back-room.jpg"
  image_back : "images/2025-session.jpg"
  image_front : "images/2025-craft-beer.jpg"
  content : "The conference that was born from a <strong><a href=https://twitter.com/sogrady/statuses/38353939124461568>tweet</a></strong> is back for 2026, bringing you the best speakers, talks you will hear nowhere else and – of course – the best craft beer the world has to offer. <p>Attendees arriving the night before the conference will be treated to a special welcome event. Thursday will feature a full day of single track sessions, and at the conclusion of the day we will be gathering for our usual off-the-hook beer tasting and dinner. Join us on Friday for a half day of sessions before heading out to enjoy an autumn in lovely Portland, ME.</p>"
  button:
    enable : true
    label : "Become a Sponsor"
    link : "sponsorships/"

######################### Call to action #########################
cta:
  enable : true
  subtitle : "Get your ticket before they're gone!"
  title : "Don't miss out on the **conference that isn't just about tech**, where you'll keep coming back year after year for **community**."
  image : "images/2025-back-room.jpg"
  button:
    enable : true
    label : "get ticket"
    link : "https://ti.to/monktoberfest/2025"

