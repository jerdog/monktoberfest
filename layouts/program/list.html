{{ define "main" }}

<section class="section">
  <div class="container">
    <div class="row-full">
      <div class="col-md-12 col-lg-12 pr-lg-5">
        <div class="row">
          {{ with .Content }}
          <div class="col-12 mb-4">
            <div class="post-blog">
              <div class="content">
                {{ . }}
              </div>
            </div>
          </div>
          {{ end }}
          {{ $paginator := .Paginate .Data.Pages 10 }}
          {{ range $paginator.Pages }}
          <div class="col-12">
            <article class="blog-article box-shadow mb-4">
              <div class="content py-4 px-4">
                <h4 class="mb-0"><a href="{{ .Permalink }}">{{ .Title | markdownify }}</a></h4>
              </div>
            </article>
          </div>
          {{ end }}
          <div class="col-12">
            {{ template "_internal/pagination.html" . }}
          </div>
        </div>
      </div>
      {{/*  {{ partial "blog-sidebar.html" . }}  */}}
    </div>
  </div>
</section>

{{ end }}
